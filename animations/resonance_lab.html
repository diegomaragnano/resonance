const it=[['q','Quality factor Q',S.Q.toFixed(2)],['','m = 1 kg, k',K.toFixed(1)+' N/m'],['','Damping c',(W0/S.Q).toFixed(2)+' N·s/m'],['','Damping ratio ζ',z.toFixed(3)],['','Settling time ≈ 2Q/ω₀',(2*S.Q/W0).toFixed(1)+' s'],['','Natural ω₀',W0.toFixed(2)+' rad/s'],['','Damped ω_d',(W0*Math.sqrt(Math.max(0,1-z*z))).toFixed(3)+' rad/s'],['','HWHM ≈ ω₀/2Q',(W0/2/S.Q).toFixed(3)+' rad/s'],['','Drive ω',(S.r*W0).toFixed(3)+' rad/s'],['','Theory amplification',th.toFixed(2)+'×'],['','Measured',S.drive?m.toFixed(2)+'×'+(S.sweep||settled()?'':' (settling…)'):'free decay'],['','Mass amplitude X',(m*S.Y/1000).toFixed(4)+' m'],['','Phase lag',ph.toFixed(0)+'°']];
$('ro').innerHTML=it.map(i=>'<div class="'+i[0]+'">'+i[1]+'<b>'+i[2]+'</b></div>').join('');
$('rv').textContent='ω/ω₀ = '+S.r.toFixed(2)+'  (ω = '+(S.r*W0).toFixed(2)+' rad/s)';$('qv').textContent=S.Q.toFixed(1);$('yv').textContent=S.Y.toFixed(1)+' mm (Y = '+(S.Y/1000).toFixed(4)+' m)'}
function frame(now){const T=Math.min(.05,(now-last)/1000)*S.speed;last=now;
if(!S.paused){const n=Math.max(1,Math.ceil(T/.004)),dt=T/n;for(let i=0;i<n;i++){if(S.sweep){S.r+=.4*W0/(S.Q*S.Q)*dt;if(S.r>=S.re){S.sweep=false;$('sw').classList.remove('on')}}step(dt)}
if(S.sweep&&S.t>=nextT){trace.push([S.r,meas()/S.Y]);nextT=S.t+.5;$('r').value=S.r}}
drawSim();drawTr();drawRc();drawPh();if(fr++%5==0)readout();requestAnimationFrame(frame)}
const setR=r=>{S.r=r;$('r').value=r;S.sweep=false;S.tc=S.t;$('sw').classList.remove('on')},ch=()=>{trace=[];S.tc=S.t};
$('r').oninput=e=>setR(+e.target.value);$('q').oninput=e=>{S.Q=Math.exp(+e.target.value);ch()};$('y').oninput=e=>{S.Y=+e.target.value;ch()};$('w').oninput=e=>{W0=+e.target.value;K=W0*W0;ch()};
$('mode').onchange=e=>{S.base=e.target.value=='b';ch()};$('sp').onchange=e=>{S.speed=+e.target.value;trace=[]};
$('sn').onclick=()=>setR(1);$('p5').onclick=()=>setR(.5);$('p2').onclick=()=>setR(2);
$('sw').onclick=()=>{S.sweep=!S.sweep;$('sw').classList.toggle('on',S.sweep);if(S.sweep){S.r=Math.max(.3,1-4/S.Q);S.re=1+4/S.Q;$('r').value=S.r;trace=[];S.drive=true;S.A0=0;$('dr').textContent='Stop drive'}};
$('dr').onclick=()=>{S.drive=!S.drive;if(S.drive){S.A0=0;S.tc=S.t}else{S.sweep=false;$('sw').classList.remove('on');S.t0=S.t;S.A0=Math.hypot(S.x,S.v/W0)}$('dr').textContent=S.drive?'Stop drive':'Resume drive'};
$('pa').onclick=()=>{S.paused=!S.paused;$('pa').textContent=S.paused?'Play':'Pause'};
$('rs').onclick=()=>{Object.assign(S,{x:0,v:0,phi:0,t:0,drive:true,sweep:false,A0:0,tc:0,t0:0});hist=[];trace=[];nextS=0;$('dr').textContent='Stop drive';$('sw').classList.remove('on')};
$('vw').onclick=()=>{S.view=S.view=='t'?'p':'t';$('vw').classList.toggle('on',S.view=='p');$('vw').textContent=S.view=='p'?'Time trace':'Phase portrait'};
$('pp').onclick=()=>{S.ph=!S.ph;$('phc').hidden=!S.ph;$('pp').classList.toggle('on',S.ph)};
if(matchMedia('(prefers-reduced-motion:reduce)').matches){S.paused=true;$('pa').textContent='Play'}
$('q').value=Math.log(S.Q);requestAnimationFrame(frame);
</script></body></html>
